<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MetroGo</title>
  <meta name="theme-color" content="#cdd9c5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#323c2a" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip" href="#plan-form">Skip to the planner</a>

  <header class="top">
    <h1 class="brand"><img src="/logo.svg" alt="" width="32" height="32"><span class="word">Metro<b>Go</b></span></h1>
    <div id="account" class="account">
      <span id="account-out">
        <a class="link" id="open-login" href="/login.html?next=/">Log in</a>
        <a class="link" id="open-register" href="/login.html?next=/#register">Create account</a>
      </span>
      <span id="account-in" hidden>
        <a class="link" id="my-journeys" href="/journeys.html">My journeys</a>
        <span>Signed in as <strong id="whoami"></strong></span>
        <button type="button" id="logout" class="link">Log out</button>
      </span>
    </div>
  </header>

  <main class="layout">
    <div class="left">
      <section class="panel" aria-labelledby="planner-title">
        <h2 id="planner-title">Plan a journey</h2>
        <form id="plan-form" autocomplete="off">
          <div class="field">
            <label for="from-input">From</label>
            <input id="from-input" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="from-list" placeholder="Start station" maxlength="60">
            <ul id="from-list" class="suggest" role="listbox" hidden></ul>
          </div>
          <button type="button" id="swap" class="swap" aria-label="Swap start and destination" title="Swap start and destination">&#8645;</button>
          <div class="field">
            <label for="to-input">To</label>
            <input id="to-input" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="to-list" placeholder="Destination station" maxlength="60">
            <ul id="to-list" class="suggest" role="listbox" hidden></ul>
          </div>
          <fieldset class="seg-group">
            <legend>What matters most?</legend>
            <div class="segmented">
              <label><input type="radio" name="prefer" value="fastest" checked><span><b aria-hidden="true">&#9201;</b> Fastest</span></label>
              <label><input type="radio" name="prefer" value="cheapest"><span><b aria-hidden="true">&#8377;</b> Cheapest</span></label>
              <label><input type="radio" name="prefer" value="fewest"><span><b aria-hidden="true">&#8644;</b> Fewest changes</span></label>
            </div>
          </fieldset>
          <fieldset class="seg-group">
            <legend>When?</legend>
            <div class="segmented">
              <label><input type="radio" name="day" value="weekday" checked><span>Mon&ndash;Sat</span></label>
              <label><input type="radio" name="day" value="sunday"><span>Sunday / holiday</span></label>
            </div>
          </fieldset>
          <button type="submit" id="plan-button" class="primary">Find routes</button>
        </form>
        <p id="message" class="message" role="alert" hidden></p>
      </section>

      <section id="results" class="results" aria-live="polite" tabindex="-1"></section>

    </div>

    <div class="right">
      <div id="map" class="map" role="region" aria-label="Map of the metro network"></div>
      <p id="map-note" class="hint" hidden></p>
    </div>
  </main>

  <footer class="foot">
    <p id="status-line"></p>
    <p>Estimates only: times leave out waiting, and the data may be out of date.</p>
  </footer>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/shared.js"></script>
  <script src="/search.js"></script>
  <script src="/app.js"></script>
</body>
</html>
